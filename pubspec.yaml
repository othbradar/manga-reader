name: copymanga_reader
description: 共用 SQLite 与章节 ZIP 漫画库的 Android、iOS、iPadOS 和 macOS 阅读器
publish_to: none
version: 0.5.1+33

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  cached_network_image: ^3.4.1
  crypto: ^3.0.7
  dio: ^5.9.2
  ffi: ^2.1.4
  fast_gbk: ^1.0.0
  lpinyin: ^2.0.3
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  path_provider_android: 2.2.23
  provider: ^6.1.5+1
  sqflite: ^2.4.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/sql/novel_library.sql
    - assets/licenses/jpeg_xl.txt
    - assets/opencc/LICENSE
    - assets/opencc/STCharacters.txt
    - assets/opencc/TSCharacters.txt
